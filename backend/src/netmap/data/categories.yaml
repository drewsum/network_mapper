# What kind of traffic a domain is, where its organization's category (organizations.yaml)
# would say otherwise: ad and analytics services of bigger companies, and the plumbing
# every device uses (connectivity checks, time, certificate status). See
# netmap/categories.py. The longest matching suffix wins, so a host can be listed under a
# domain listed elsewhere. Each suffix may appear once.

