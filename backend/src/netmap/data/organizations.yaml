# Which organization a domain belongs to (see netmap/orgs.py).
#
# For each domain, the longest matching suffix decides: "s3.amazonaws.com" and
# "amazonaws.com" both match the entry amazonaws.com. A domain with no match takes the
# organization of the network (ASN) its most recently seen IP is in. Domains that match
# neither are grouped as "Other".
#
# So an organization's own domains name it even when a cloud or CDN hosts them (a Tuya
# domain on AWS counts as Tuya), and the network entries only name the host of domains
# nobody claims. Amazon's own services and AWS-hosted ones are kept apart for that reason.
#
# Each suffix and each ASN may appear under one organization only. Rules added in the app
# (Organizations page) take precedence over this file.

Amazon:
  domains: [amazon.com, amazon.ca, amazon.co.uk, amazon.de, amazon.co.jp, amazon.dev,
            amazonalexa.com, alexa.com, a2z.com, amazontrust.com, amazonvideo.com,
            primevideo.com, aiv-cdn.net, aiv-delivery.net, media-amazon.com,
