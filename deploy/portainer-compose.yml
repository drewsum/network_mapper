# Server stack. Deployed by Portainer as a Git-repository stack (docs/deploy-portainer.md), or
# with plain `docker compose` from a checkout on the host (docs/deploy-truenas.md), which adds
# deploy/compose.build.yml to build the image.
# All settings come from env vars, passed in explicitly below. (Portainer doesn't write a
# stack.env that compose can read for Git stacks.) With Portainer, the image is built on the
# host over SSH (scripts/build-on-host.sh), because the Portainer TrueNAS app can't run
# builds. The API also serves the built UI.

# Every NETMAP_* setting from .env.example. Blank values fall back to the app's defaults.
x-netmap-env: &netmap-env
  NETMAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  NETMAP_LAN_CIDR: ${NETMAP_LAN_CIDR:-}
  NETMAP_LAN_IFACE: ${NETMAP_LAN_IFACE:-}
  NETMAP_ARP_SWEEP_INTERVAL_SECONDS: ${NETMAP_ARP_SWEEP_INTERVAL_SECONDS:-}
  NETMAP_DEVICE_OFFLINE_AFTER_SECONDS: ${NETMAP_DEVICE_OFFLINE_AFTER_SECONDS:-}
  NETMAP_OUI_REFRESH_DAYS: ${NETMAP_OUI_REFRESH_DAYS:-}
  NETMAP_NAMES_INTERVAL_SECONDS: ${NETMAP_NAMES_INTERVAL_SECONDS:-}
  NETMAP_HOSTNAME_PRECEDENCE: ${NETMAP_HOSTNAME_PRECEDENCE:-}
  NETMAP_RDNS_SERVER: ${NETMAP_RDNS_SERVER:-}
  NETMAP_PORT_SCAN_INTERVAL_SECONDS: ${NETMAP_PORT_SCAN_INTERVAL_SECONDS:-}
  NETMAP_UPNP_POLL_INTERVAL_SECONDS: ${NETMAP_UPNP_POLL_INTERVAL_SECONDS:-}
  NETMAP_PIHOLE_URL: ${NETMAP_PIHOLE_URL:-}
  NETMAP_PIHOLE_PASSWORD: ${NETMAP_PIHOLE_PASSWORD:-}
  NETMAP_PIHOLE_POLL_SECONDS: ${NETMAP_PIHOLE_POLL_SECONDS:-}
  NETMAP_PIHOLE_VERIFY_TLS: ${NETMAP_PIHOLE_VERIFY_TLS:-}
  NETMAP_MAXMIND_LICENSE_KEY: ${NETMAP_MAXMIND_LICENSE_KEY:-}
  NETMAP_GEOIP_REFRESH_DAYS: ${NETMAP_GEOIP_REFRESH_DAYS:-}
  NETMAP_ABUSECH_AUTH_KEY: ${NETMAP_ABUSECH_AUTH_KEY:-}
  NETMAP_BLOCKLIST_REFRESH_HOURS: ${NETMAP_BLOCKLIST_REFRESH_HOURS:-}
  NETMAP_BASELINE_LEARNING_DAYS: ${NETMAP_BASELINE_LEARNING_DAYS:-}
  NETMAP_DNS_BYPASS_HOURS: ${NETMAP_DNS_BYPASS_HOURS:-}
  NETMAP_DNS_BYPASS_MIN_LOOKUPS: ${NETMAP_DNS_BYPASS_MIN_LOOKUPS:-}
  NETMAP_APPRISE_URLS: ${NETMAP_APPRISE_URLS:-}
  NETMAP_NOTIFY_MAX_PER_HOUR: ${NETMAP_NOTIFY_MAX_PER_HOUR:-}
  NETMAP_PUBLIC_URL: ${NETMAP_PUBLIC_URL:-}
  NETMAP_ADMIN_PASSWORD: ${NETMAP_ADMIN_PASSWORD:-}
  NETMAP_SESSION_DAYS: ${NETMAP_SESSION_DAYS:-}
  NETMAP_TRUSTED_PROXIES: ${NETMAP_TRUSTED_PROXIES:-}
  NETMAP_BACKUP_INTERVAL_HOURS: ${NETMAP_BACKUP_INTERVAL_HOURS:-}
  NETMAP_BACKUP_KEEP: ${NETMAP_BACKUP_KEEP:-}
  NETMAP_RAW_RETENTION_DAYS: ${NETMAP_RAW_RETENTION_DAYS:-}
  NETMAP_AGG_1H_RETENTION_DAYS: ${NETMAP_AGG_1H_RETENTION_DAYS:-}
  NETMAP_AGG_1D_RETENTION_DAYS: ${NETMAP_AGG_1D_RETENTION_DAYS:-}
  NETMAP_COMPRESS_AFTER_DAYS: ${NETMAP_COMPRESS_AFTER_DAYS:-}
  NETMAP_LOG_LEVEL: ${NETMAP_LOG_LEVEL:-}
  NETMAP_CRITICAL_GRACE_MINUTES: ${NETMAP_CRITICAL_GRACE_MINUTES:-}
  NETMAP_CRITICAL_REMIND_HOURS: ${NETMAP_CRITICAL_REMIND_HOURS:-}
  NETMAP_UPLOAD_HEAVY_MB: ${NETMAP_UPLOAD_HEAVY_MB:-}
  NETMAP_UPLOAD_HEAVY_RATIO: ${NETMAP_UPLOAD_HEAVY_RATIO:-}
  NETMAP_CAPTURE_INTERFACE: ${NETMAP_CAPTURE_INTERFACE:-}
  NETMAP_CAPTURE_REPORT_SECONDS: ${NETMAP_CAPTURE_REPORT_SECONDS:-}
  NETMAP_NETFLOW_PORT: ${NETMAP_NETFLOW_PORT:-}
  NETMAP_NETFLOW_BIND: ${NETMAP_NETFLOW_BIND:-}
  NETMAP_PCAP_MAX_MB: ${NETMAP_PCAP_MAX_MB:-}
  NETMAP_PCAP_MAX_MINUTES: ${NETMAP_PCAP_MAX_MINUTES:-}
  NETMAP_PCAP_KEEP: ${NETMAP_PCAP_KEEP:-}
  NETMAP_FINGERBANK_API_KEY: ${NETMAP_FINGERBANK_API_KEY:-}
  NETMAP_UNIFI_URL: ${NETMAP_UNIFI_URL:-}
  NETMAP_UNIFI_USERNAME: ${NETMAP_UNIFI_USERNAME:-}
  NETMAP_UNIFI_PASSWORD: ${NETMAP_UNIFI_PASSWORD:-}
  NETMAP_UNIFI_SITE: ${NETMAP_UNIFI_SITE:-}
  NETMAP_UNIFI_VERIFY_TLS: ${NETMAP_UNIFI_VERIFY_TLS:-}
  NETMAP_OPENWRT_URLS: ${NETMAP_OPENWRT_URLS:-}
  NETMAP_OPENWRT_USERNAME: ${NETMAP_OPENWRT_USERNAME:-}
  NETMAP_OPENWRT_PASSWORD: ${NETMAP_OPENWRT_PASSWORD:-}
  NETMAP_OPENWRT_VERIFY_TLS: ${NETMAP_OPENWRT_VERIFY_TLS:-}
  NETMAP_WIFI_POLL_SECONDS: ${NETMAP_WIFI_POLL_SECONDS:-}
  NETMAP_METRICS_TOKEN: ${NETMAP_METRICS_TOKEN:-}

# Container logs rotate at 10 MB, three files each, so they can't fill the pool.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The app containers run as the image's non-root user, with every capability dropped and a
# read-only filesystem; only /tmp (and the volumes below) can be written.
x-app: &app
  image: ${NETMAP_IMAGE:-netmap:local}
  pull_policy: never
  environment: *netmap-env
  restart: unless-stopped
  logging: *logging
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: ${NETMAP_APP_MEMORY_LIMIT:-1g}

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - ${NETMAP_DATA_DIR:?set NETMAP_DATA_DIR to the project dataset path}/db:/var/lib/postgresql/data
    # Loopback only: for the host-networked collector and for tools over SSH.
    ports:
      - "127.0.0.1:${NETMAP_DB_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      # Over TCP: during first-run init, Postgres listens only on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # First-run initdb (and TimescaleDB's tuning restart) can take minutes on a ZFS dataset;
      # failures during it don't count.
      start_period: 5m
    restart: unless-stopped
    logging: *logging
    mem_limit: ${NETMAP_DB_MEMORY_LIMIT:-2g}

  migrate:
    <<: *app
    command: ["netmap", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["netmap", "api"]
    ports:
      - "${NETMAP_API_PUBLISH_PORT:-8000}:8000"
    # Packet captures made by the capture service, for download.
    volumes:
      - captures:/captures:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  collector:
    <<: *app
    # python-netraw carries CAP_NET_RAW as a file capability (see Dockerfile), since the
    # image's non-root user doesn't get cap_add capabilities on its own.
    command: ["python-netraw", "-m", "netmap.cli", "collector"]
    # Host networking so discovery sees the real LAN (ARP, mDNS, DHCP broadcasts).
    # The db service isn't reachable by name from here, so use its loopback port.
    network_mode: host
    # The only capability any app container gets back.
    cap_add: [NET_RAW]
    # Downloaded GeoIP databases (about 140 MB), kept across restarts and image updates.
    volumes:
      - geoip:/app/geoip
    environment:
      <<: *netmap-env
      NETMAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${NETMAP_DB_PUBLISH_PORT:-5433}/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/netmap-collector-heartbeat') > 60)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  # A pg_dump every NETMAP_BACKUP_INTERVAL_HOURS into <NETMAP_DATA_DIR>/backups (see
  # docs/backups.md). Starts as root only to hand that directory to the netmap user, then
  # runs as it; CHOWN, SETUID and SETGID are all it needs for that.
  backup:
    <<: *app
    user: "0"
    command: ["sh", "-c", "chown netmap /backups && exec setpriv --reuid=netmap --regid=netmap --clear-groups netmap backup"]
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - ${NETMAP_DATA_DIR}/backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/netmap-backup-heartbeat') > 900)"]
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Opt-in traffic capture (docs/span.md): flows from a SPAN mirror port and/or NetFlow/IPFIX,
  # live throughput, packet captures. Started only with the "capture" profile
  # (COMPOSE_PROFILES=capture), and only useful with NETMAP_CAPTURE_INTERFACE or
  # NETMAP_NETFLOW_PORT set.
  capture:
    <<: *app
    profiles: [capture]
    # python-netraw and tcpdump carry CAP_NET_RAW as file capabilities (see Dockerfile).
    command: ["python-netraw", "-m", "netmap.cli", "capture"]
    # Host networking to see the mirror NIC (and to receive NetFlow exports on the host).
    network_mode: host
    cap_add: [NET_RAW]
    volumes:
      - captures:/captures
    environment:
      <<: *netmap-env
      NETMAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${NETMAP_DB_PUBLISH_PORT:-5433}/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/netmap-capture-heartbeat') > 60)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  geoip:
  captures:
